                                                            .container {
                                                                position: relative;
                                                                z-index: 10;
                                                                width: 100%;
                                                                display: flex;
                                                                justify-content: center;
                                                                align-items: center;
                                                            }

                                                            .mecha-card {
                                                                width: 100%;
                                                                max-width: 440px;
                                                                background: radial-gradient(circle at 50% 20%, #4A2D00 0%, #211400 70%, #120C00 100%);
                                                                /* Kartu gradasi gold tua ke hitam */
                                                                border-radius: 4px;
                                                                border: 2px solid #D4AF37;
                                                                /* Border kartu diubah ke gold neon */
                                                                box-shadow: 0 0 35px rgba(165, 50, 42, 0.8), inset 0 0 20px rgb(255 255 255 / 40%);
                                                                /* Glow kartu diubah ke gold neon */
                                                                padding: 20px 16px;
                                                                position: relative;
                                                                overflow: hidden;
                                                            }

                                                            .mecha-hud-grid {
                                                                position: absolute;
                                                                inset: 0;
                                                                background-image:
                                                                    linear-gradient(rgba(212, 175, 55, 0.12) 1px, transparent 1px),
                                                                    /* Grid dalam kartu diubah ke gold neon transparan */
                                                                    linear-gradient(90deg, rgba(212, 175, 55, 0.12) 1px, transparent 1px);
                                                                background-size: 14px 14px;
                                                                pointer-events: none;
                                                                z-index: 1;
                                                            }

                                                            .tech-corner {
                                                                position: absolute;
                                                                width: 14px;
                                                                height: 14px;
                                                                border: 2px solid #E8B94A;
                                                                /* Siku kartu merah-gold */
                                                                pointer-events: none;
                                                                z-index: 5;
                                                            }

                                                            .corner-tl {
                                                                top: 8px;
                                                                left: 8px;
                                                                border-right: none;
                                                                border-bottom: none;
                                                            }

                                                            .corner-tr {
                                                                top: 8px;
                                                                right: 8px;
                                                                border-left: none;
                                                                border-bottom: none;
                                                            }

                                                            .corner-bl {
                                                                bottom: 8px;
                                                                left: 8px;
                                                                border-right: none;
                                                                border-top: none;
                                                            }

                                                            .corner-br {
                                                                bottom: 8px;
                                                                right: 8px;
                                                                border-left: none;
                                                                border-top: none;
                                                            }

                                                            .mecha-logo {
                                                                width: 200px;
                                                                max-width: 100%;
                                                                margin: 0 auto 12px;
                                                                display: block;
                                                                position: relative;
                                                                z-index: 4;
                                                                filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.75));
                                                            }

                                                            .mecha-logo amp-img {
                                                                width: 100%;
                                                                height: auto;
                                                            }

                                                            .banner-frame {
                                                                position: relative;
                                                                z-index: 4;
                                                                border: 1px solid #E8B94A;
                                                                /* Bingkai banner merah-gold */
                                                                border-radius: 6px;
                                                                overflow: hidden;
                                                                box-shadow: 0 0 20px rgba(212, 175, 55, 0.60);
                                                                /* Glow bingkai diubah ke gold */
                                                                margin-bottom: 18px;
                                                            }

                                                            .scan-line {
                                                                position: absolute;
                                                                top: 0;
                                                                left: 0;
                                                                width: 100%;
                                                                height: 3px;
                                                                background: linear-gradient(90deg, transparent, #8A5A00, #D4AF37, #FFF1A8, #D4AF37, #8A5A00, transparent);
                                                                /* Garis scan diubah ke gold neon */
                                                                box-shadow: 0 0 10px #E8B94A, 0 0 5px #8A5A00;
                                                                z-index: 6;
                                                                animation: scanAnim 2.5s ease-in-out infinite alternate;
                                                            }

                                                            @keyframes scanAnim {
                                                                0% {
                                                                    top: 0%;
                                                                }

                                                                100% {
                                                                    top: 96%;
                                                                }
                                                            }


                                                            .btn-group {
                                                                display: flex;
                                                                gap: 14px;
                                                                margin-bottom: 18px;
                                                                position: relative;
                                                                z-index: 4;
                                                            }

                                                            .mecha-btn {
                                                                flex: 1;
                                                                height: 52px;
                                                                line-height: 52px;
                                                                text-align: center;
                                                                font-family: 'Orbitron', sans-serif;
                                                                font-weight: 900;
                                                                font-size: 17px;
                                                                text-decoration: none;
                                                                clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
                                                                position: relative;
                                                                overflow: hidden;
                                                                letter-spacing: 1.5px;
                                                            }

                                                            /* Tombol Daftar diubah menjadi Gold Neon Menyala seperti di gambar */
                                                            .btn-red {
                                                                color: #FFF1A8;
                                                                background: linear-gradient(135deg, #8A5A00 0%, #C99622 45%, #D4AF37 100%);
                                                                /* Gradasi gold tua ke muda */
                                                                border: 1px solid #D4AF37;
                                                                /* Border merah-gold */
                                                                animation: mechaPulseGold 0.8s infinite ease-in-out alternate, mechaShake 3s infinite ease-in-out;
                                                            }

                                                            /* Tombol Login diubah menjadi Gold Terang/Silver ke Gold Neon */
                                                            .btn-yellow {
                                                                color: #FFF1A8;
                                                                background: linear-gradient(135deg, #D4AF37 0%, #C99622 50%, #8A5A00 100%);
                                                                /* Gradasi gold terang ke silver ke gold terang */
                                                                border: 1px solid #D4AF37;
                                                                /* Border merah-gold */
                                                                animation: mechaPulseWhite 0.8s infinite ease-in-out alternate, mechaShake 3s 1.5s infinite ease-in-out;
                                                            }

                                                            .mecha-btn::before {
                                                                content: '';
                                                                position: absolute;
                                                                top: -50%;
                                                                left: -100%;
                                                                width: 50%;
                                                                height: 200%;
                                                                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
                                                                transform: rotate(35deg);
                                                                animation: laserSweep 1.2s infinite linear;
                                                            }

                                                            .mecha-btn::after {
                                                                content: '';
                                                                position: absolute;
                                                                top: -50%;
                                                                left: -100%;
                                                                width: 20%;
                                                                height: 200%;
                                                                background: linear-gradient(90deg, transparent, #FFF1A8, transparent);
                                                                transform: rotate(35deg);
                                                                animation: laserSweep 1.2s 0.2s infinite linear;
                                                            }

                                                            /* Efek Pulse Tombol Daftar diubah ke Gold */
                                                            @keyframes mechaPulseGold {
                                                                0% {
                                                                    transform: scale(1);
                                                                    box-shadow: 0 0 10px rgba(212, 175, 55, 0.80), 0 0 8px rgba(139, 0, 0, 0.70), inset 0 0 5px #FFF1A8;
                                                                    filter: brightness(1) contrast(100%);
                                                                }

                                                                100% {
                                                                    transform: scale(1.05);
                                                                    box-shadow: 0 0 30px #D4AF37, 0 0 18px #8A5A00, 0 0 15px #FFF1A8, inset 0 0 12px #FFF1A8;
                                                                    filter: brightness(1.4) contrast(120%);
                                                                }
                                                            }

                                                            /* Efek Pulse Tombol Login diubah ke Gold Terang */
                                                            @keyframes mechaPulseWhite {
                                                                0% {
                                                                    transform: scale(1);
                                                                    box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), inset 0 0 5px #FFF1A8;
                                                                    filter: brightness(1) contrast(100%);
                                                                }

                                                                100% {
                                                                    transform: scale(1.05);
                                                                    box-shadow: 0 0 30px #D4AF37, 0 0 18px #8A5A00, 0 0 15px #FFF1A8, inset 0 0 12px #E8B94A;
                                                                    filter: brightness(1.4) contrast(120%);
                                                                }
                                                            }

                                                            @keyframes mechaShake {

                                                                0%,
                                                                92%,
                                                                100% {
                                                                    transform: translateY(0) rotate(0deg);
                                                                }

                                                                93% {
                                                                    transform: translateY(-2px) rotate(-1deg);
                                                                }

                                                                95% {
                                                                    transform: translateY(2px) rotate(1deg);
                                                                }

                                                                97% {
                                                                    transform: translateY(-1px) rotate(0deg);
                                                                }
                                                            }

                                                            @keyframes laserSweep {
                                                                0% {
                                                                    left: -100%;
                                                                }

                                                                100% {
                                                                    left: 160%;
                                                                }
                                                            }
